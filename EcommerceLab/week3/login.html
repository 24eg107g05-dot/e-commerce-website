<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - SoleStride Shoes</title>
    <!-- External stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="brand-container">
            <div>
                <div class="brand-title">SoleStride Shoes</div>
                <div class="brand-tagline">Premium Footwear Store</div>
            </div>
            <nav>
                <a href="index.html">Home</a>
                <a href="login.html" class="active">Login</a>
            </nav>
        </div>
    </header>

    <!-- Main Content with Styled Form -->
    <main>
        <div class="auth-wrapper">
            <div class="auth-header">
                <h2>Customer Sign In</h2>
                <p>Welcome back! Access your shoes wishlist & orders.</p>
            </div>

            <form action="#" method="post">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="user@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe" style="font-weight: normal; margin-bottom: 0;">Remember me on this browser</label>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Sign In</button>
                    <button type="reset" class="btn btn-secondary">Clear</button>
                </div>

                <div class="auth-links">
                    <p><a href="#">Forgot password?</a></p>
                    <p style="margin-top: 6px;">Don't have an account? <a href="../week2/register.html">Register here</a></p>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 SoleStride Shoe Store. Styled with External CSS (Web Development Lab - Week 3)</p>
    </footer>
</body>
</html>

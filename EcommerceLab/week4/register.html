<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration Validation - SoleStride Shoes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            padding: 20px;
            color: #1f2937;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #1e3a8a;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 25px;
        }

        /* Alert notification banners */
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        .alert-error ul {
            margin-top: 6px;
            margin-left: 20px;
        }

        .alert-success {
            background-color: #dcfce7;
            color: #166534;
            border-left: 4px solid #22c55e;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #374151;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: normal;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-submit {
            background-color: #2563eb;
            color: white;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        .btn-reset {
            background-color: #9ca3af;
            color: white;
        }

        .btn-reset:hover {
            background-color: #6b7280;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>SoleStride Shoes</h2>
        <p class="subtitle">Week 4 — Client-Side JavaScript Form Validation</p>

        <!-- Dynamic Success/Error Feedback Container -->
        <div id="feedbackMessage" class="alert"></div>

        <!-- Registration Form (novalidate disables browser native tooltips to test custom JS) -->
        <form id="registrationForm" novalidate>
            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" placeholder="e.g. Navya Sharma">
            </div>

            <!-- Email Address -->
            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" placeholder="e.g. navya@example.com">
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label for="phone">Phone Number (10 digits) *</label>
                <input type="tel" id="phone" placeholder="e.g. 9876543210" maxlength="10">
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password (Minimum 6 characters) *</label>
                <input type="password" id="password" placeholder="Create a strong password">
            </div>

            <!-- Preferred Shoe Size -->
            <div class="form-group">
                <label for="shoeSize">Preferred Shoe Size (US)</label>
                <select id="shoeSize">
                    <option value="US 7">US 7</option>
                    <option value="US 8" selected>US 8</option>
                    <option value="US 9">US 9</option>
                    <option value="US 10">US 10</option>
                    <option value="US 11">US 11</option>
                </select>
            </div>

            <!-- Shipping Address -->
            <div class="form-group">
                <label for="address">Shipping Address *</label>
                <textarea id="address" rows="3" placeholder="Enter delivery street address, city, and zip code"></textarea>
            </div>

            <!-- Terms & Conditions Checkbox -->
            <div class="form-group">
                <label class="checkbox-label" for="terms">
                    <input type="checkbox" id="terms">
                    I agree to the SoleStride terms, privacy policy, and return guidelines.
                </label>
            </div>

            <!-- Buttons -->
            <div class="btn-group">
                <button type="submit" class="btn-submit">Submit Registration</button>
                <button type="reset" class="btn-reset">Reset</button>
            </div>
        </form>

        <footer>
            SoleStride Shoes &copy; 2026 (Web Development Lab - Week 4)
        </footer>
    </div>

    <!-- Linking external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>

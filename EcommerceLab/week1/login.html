<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - SoleStride Shoes</title>
</head>
<body>
    <!-- Header Section with Navigation -->
    <header>
        <h1>SoleStride Shoes</h1>
        <nav>
            <a href="index.html">Home</a> |
            <a href="login.html">Login</a>
        </nav>
        <hr>
    </header>

    <!-- Main Login Container -->
    <main>
        <h2>Customer Login</h2>
        <p>Enter your account credentials to access your shopping cart and orders.</p>

        <!-- Login Form -->
        <form action="#" method="post">
            <fieldset>
                <legend>Account Credentials</legend>
                
                <p>
                    <label for="username">Username or Email Address:</label><br>
                    <input type="text" id="username" name="username" placeholder="e.g., john@example.com" required>
                </p>

                <p>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </p>

                <p>
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me on this computer</label>
                </p>

                <p>
                    <input type="submit" value="Sign In">
                    <input type="reset" value="Clear">
                </p>

                <p>
                    <a href="#">Forgot your password?</a> | 
                    New customer? <a href="#">Create an account</a>
                </p>
            </fieldset>
        </form>
    </main>

    <!-- Footer Section -->
    <footer>
        <hr>
        <p>&copy; 2026 SoleStride Shoe Store. All rights reserved. (Web Development Lab - Week 1)</p>
    </footer>
</body>
</html>
